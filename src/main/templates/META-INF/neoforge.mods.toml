modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/mine-edge/MineEdge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/mine-edge/MineEdge"
authors="${mod_authors}"
logoFile="icon256.png"
logoBlur=true
description='''
Mirror's Edge-inspired movement for Minecraft.
Required on both the client and server.
'''

[[mixins]]
config="mineedge.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
versionRange="${cloth_config_version_range}"
ordering="AFTER"
side="CLIENT"
