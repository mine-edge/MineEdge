name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run unit tests and GameTests
        run: bash ./gradlew build runGameTestServer --stacktrace --console=plain

      - name: Verify release JAR excludes development tests
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          jars = list(Path('build/libs').glob('*.jar'))
          if not jars:
              raise SystemExit('No release JAR was built')

          for jar in jars:
              with ZipFile(jar) as archive:
                  development_files = [
                      name for name in archive.namelist()
                      if name.startswith('dev/mineedge/integration/gametest/')
                  ]
              if development_files:
                  raise SystemExit(f'{jar} contains development tests: {development_files}')
              print(f'Verified {jar}: development tests are excluded')

      - name: Upload release JAR
        uses: actions/upload-artifact@v4
        with:
          name: MineEdge-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports and GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            run-gametest/logs/
            run-gametest/crash-reports/
          if-no-files-found: ignore
          retention-days: 14
